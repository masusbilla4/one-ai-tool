{% extends "base.html" %}

{% block title %}Edit Sentences - One AI Tool{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="content-card rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-white">
                <i class="fas fa-edit mr-2 text-indigo-400"></i>Edit Sentences
            </h1>
            <a href="{{ url_for('sentencedb.dashboard') }}" class="text-slate-400 hover:text-slate-200 transition">
                <i class="fas fa-arrow-left mr-1"></i>Back
            </a>
        </div>

        <!-- Search -->
        <form method="GET" action="{{ url_for('sentencedb.edit') }}" class="mb-6">
            <div class="flex gap-2">
                <input type="text" name="search" value="{{ search_keyword }}" placeholder="Search sentences..."
                    class="input-field flex-1 px-4 py-2">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-search mr-1"></i>Search
                </button>
            </div>
        </form>

        <!-- Sentences List -->
        {% if sentences %}
        <div class="space-y-3">
            {% for s in sentences %}
            <form method="POST" action="{{ url_for('sentencedb.edit') }}" class="bg-slate-800/50 rounded-lg p-4 border border-slate-700">
                <input type="hidden" name="sen_id" value="{{ s.sen_id }}">
                <div class="flex items-start gap-3">
                    <span class="text-xs text-slate-500 font-mono mt-2 whitespace-nowrap">{{ s.sen_id }}</span>
                    <div class="flex-1">
                        <input type="text" name="edited_text" value="{{ s.sentence }}"
                            class="input-field w-full px-3 py-2 text-sm">
                    </div>
                    <span class="text-xs px-2 py-1 rounded {{ 'bg-indigo-900 text-indigo-300' if s.language == 'fil' else 'bg-green-900 text-green-300' }}">
                        {{ s.language }}
                    </span>
                    <input type="hidden" name="language" value="{{ s.language }}">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-sm transition">
                        <i class="fas fa-save"></i>
                    </button>
                </div>
                <div class="text-xs text-slate-500 mt-1 ml-16">{{ s.category }}</div>
            </form>
            {% endfor %}
        </div>
        {% else %}
        <div class="text-center text-slate-500 py-8">
            <i class="fas fa-inbox text-4xl mb-3"></i>
            <p>No sentences found.</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
